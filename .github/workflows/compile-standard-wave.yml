name: Compile one fresh PE13 wave
on:
  workflow_call:
    inputs:
      wave:
        type: number
        required: true
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Restore admitted execution
        run: |
          python3 scripts/cloud_artifacts.py --run "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" \
            --name cloud-build-context --destination "$RUNNER_TEMP/context"
      - name: Resolve this dependency wave
        id: matrix
        run: |
          python3 scripts/cloud_build_plan.py matrix --context "$RUNNER_TEMP/context/context.json" \
            --wave "${{ inputs.wave }}" --github-output "$GITHUB_OUTPUT"
  compile:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          sudo apt-get update
          sudo apt-get install -y libncurses5 python-is-python3 flex bison libssl-dev libelf-dev zstd \
            ccache build-essential libxml2-utils zip unzip cpio lz4 xz-utils bc rsync
          sudo fallocate -l 8G "$RUNNER_TEMP/build.swap"
          sudo chmod 600 "$RUNNER_TEMP/build.swap"
          sudo mkswap "$RUNNER_TEMP/build.swap"
          sudo swapon "$RUNNER_TEMP/build.swap"
          uname -a > "$RUNNER_TEMP/result/runner.txt"
          nproc >> "$RUNNER_TEMP/result/runner.txt"
          free -b >> "$RUNNER_TEMP/result/runner.txt"
          df -B1 >> "$RUNNER_TEMP/result/runner.txt"
      - name: Restore admitted execution
        run: |
          python3 scripts/cloud_artifacts.py --run "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" \
            --name cloud-build-context --destination "$RUNNER_TEMP/context"
      - name: Restore cold capsule and compile native actions
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 scripts/cloud_compile.py --context "$RUNNER_TEMP/context/context.json" \
            --id "${{ matrix.id }}" --output "$RUNNER_TEMP/result" --staging "$RUNNER_TEMP/compile" \
            2>&1 | tee "$RUNNER_TEMP/result/compile.log"
      - name: Retain new outputs and native receipt
        if: always()
        uses: ./.github/actions/retain-artifact
        with:
          name: shard-${{ matrix.id }}
          path: ${{ runner.temp }}/result/
          overwrite: true
          retention-days: 30
          compression-level: 0
      - name: Retain fresh producer receipt
        if: always()
        uses: ./.github/actions/retain-artifact
        with:
          name: fresh-receipt-${{ matrix.id }}
          path: ${{ runner.temp }}/result/receipt.json
          overwrite: true
          retention-days: 30
          compression-level: 0
