name: Publish a verified PE13 flashable ZIP
run-name: ZIP ${{ inputs.operation }} ${{ inputs.tag || '(next version)' }} from assembly ${{ inputs.assembly_run }}

on:
  workflow_dispatch:
    inputs:
      assembly_run:
        description: Successful assemble-standard.yml run ID (not the compile run)
        required: true
        type: string
      tag:
        description: "Release version crux-pe13-<build>-v<n>; empty takes this assembly's release or the next free version"
        required: false
        default: ''
        type: string
      operation:
        description: Preflight (read only), prepare a draft, publish a complete draft, or release (draft, then publish)
        required: true
        default: preflight
        type: choice
        options: [preflight, draft, publish, release]
      signature:
        description: Offline P-256 signature of the payload's crux-install.txt (128 hex digits); empty signs it in the install-signing environment
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: standard-zip-release
  cancel-in-progress: false

env:
  ASSEMBLY_RUN: ${{ inputs.assembly_run }}
  RELEASE_TAG: ${{ inputs.tag }}
  OPERATION: ${{ inputs.operation }}
  GH_TOKEN: ${{ github.token }}

jobs:
  # The only job that sees the install key: no third-party action, no upload,
  # and nothing but the 128-hex-digit signature leaves it.
  sign:
    if: github.repository == 'coachpo/crux-pe13-distributed' && github.ref == 'refs/heads/main' && inputs.signature == ''
    environment: install-signing
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      signature: ${{ steps.sign.outputs.signature }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Bind assembly code before accessing the signing key
        run: python3 scripts/pipeline_code.py --run "$ASSEMBLY_RUN"
      - name: Sign the assembly's install manifest
        id: sign
        env:
          CRUX_INSTALL_SIGNING_KEY: ${{ secrets.CRUX_INSTALL_SIGNING_KEY }}
        run: python3 scripts/release_sign.py --assembly-run "$ASSEMBLY_RUN" --github-output "$GITHUB_OUTPUT"

  preflight:
    needs: sign
    if: ${{ !cancelled() && github.repository == 'coachpo/crux-pe13-distributed' && github.ref == 'refs/heads/main' && inputs.operation == 'preflight' && (needs.sign.result == 'success' || inputs.signature != '') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      SIGNATURE: ${{ inputs.signature || needs.sign.outputs.signature }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Bind assembly to this pipeline revision
        run: python3 scripts/pipeline_code.py --run "$ASSEMBLY_RUN"
      - name: Verify the assembly payload and the signed ZIP without release writes
        run: |
          python3 scripts/release_zip.py --assembly-run "$ASSEMBLY_RUN" --tag "$RELEASE_TAG" \
            --signature "$SIGNATURE" --retry-evidence "$RUNNER_TEMP/preflight-validation-failure.json"
      - name: Retain typed preflight validation evidence
        if: always()
        uses: ./.github/actions/retain-artifact
        with:
          name: preflight-validation-failure
          path: ${{ runner.temp }}/preflight-validation-failure.json
          retention-days: 3
          if-no-files-found: ignore

  release:
    needs: sign
    if: ${{ !cancelled() && github.repository == 'coachpo/crux-pe13-distributed' && github.ref == 'refs/heads/main' && inputs.operation != 'preflight' && (needs.sign.result == 'success' || inputs.signature != '') }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      SIGNATURE: ${{ inputs.signature || needs.sign.outputs.signature }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Bind assembly to this pipeline revision
        run: python3 scripts/pipeline_code.py --run "$ASSEMBLY_RUN"
      - name: Prepare, publish or release the signed ZIP
        run: |
          args=(--assembly-run "$ASSEMBLY_RUN" --tag "$RELEASE_TAG" \
                --operation "$OPERATION" --signature "$SIGNATURE")
          if [[ "$OPERATION" == preflight || "$OPERATION" == draft || "$OPERATION" == release ]]; then
            args+=(--retry-evidence "$RUNNER_TEMP/preflight-validation-failure.json")
          fi
          python3 scripts/release_zip.py "${args[@]}"
      - name: Retain typed prepublication validation evidence
        if: always()
        uses: ./.github/actions/retain-artifact
        with:
          name: preflight-validation-failure
          path: ${{ runner.temp }}/preflight-validation-failure.json
          retention-days: 3
          if-no-files-found: ignore

  report:
    needs: [sign, preflight, release]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Retry eligible prepublication validation failure without cache reuse
        if: ${{ inputs.operation != 'publish' && (needs.preflight.result == 'failure' || needs.release.result == 'failure') && !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retry/evidence"
          if ! python3 scripts/cloud_artifacts.py --run "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" \
              --name preflight-validation-failure --destination "$RUNNER_TEMP/retry/evidence"; then
            echo 'No typed preflight validation evidence is available for a safe cold retry.'
            exit 0
          fi
          build_run=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["execution_id"])' \
            "$RUNNER_TEMP/retry/evidence/preflight-validation-failure.json")
          mkdir -p "$RUNNER_TEMP/retry/context"
          if ! python3 scripts/cloud_artifacts.py --run "$build_run" --repository "$GITHUB_REPOSITORY" \
              --name cloud-build-context --destination "$RUNNER_TEMP/retry/context"; then
            echo 'No admitted compile context is available for a safe cold retry.'
            exit 0
          fi
          python3 scripts/pipeline_retry.py --stage preflight \
            --context "$RUNNER_TEMP/retry/context/context.json" \
            --failure-evidence "$RUNNER_TEMP/retry/evidence/preflight-validation-failure.json" \
            --origin-run "$build_run"
      - name: Report the failed release
        run: python3 scripts/pipeline_report.py --stage release
