name: Sign and gate PE13 release
run-name: PE13 sign ${{ inputs.build_number }} from run ${{ inputs.run_id }}

# Signs the terminal shard of an actual compile run and runs the four native
# gates before any publication step can see the delivery:
#
#   * both input artifacts are downloaded by object id and checked against the
#     GitHub artifact digest before anything is extracted,
#   * the worker receipts inside them must name the same run, task, worker commit
#     and slice manifest as the dispatch, and every signed input is re-hashed,
#   * the Recovery verifier is rebuilt from its retained sources and the retained
#     static libraries, and its unit tests run before the gate uses it,
#   * the release keys come from protected `release` environment secrets and are
#     only written into a private directory for the signing stage,
#   * the delivery is published as assets of a candidate prerelease in this
#     repository so a later publication run can verify the exact bytes again.
#
# This workflow needs the `release` environment, which requires a reviewer.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Compile run that produced the terminal shard artifact
        required: true
        type: string
      task_id:
        description: Terminal shard id
        required: true
        default: w007-s000
        type: string
      artifact:
        description: Terminal shard artifact name
        required: true
        default: shard-w007-s000
        type: string
      kernel_run_id:
        description: Compile run that produced the kernel shard artifact
        required: true
        type: string
      kernel_task_id:
        description: Kernel shard id
        required: true
        default: w001-s001
        type: string
      kernel_artifact:
        description: Kernel shard artifact name
        required: true
        default: shard-w001-s001
        type: string
      worker_commit:
        description: Optional assertion; the dispatched run heads are read from the API
        required: false
        default: ""
        type: string
      build_number:
        description: Frozen build number
        required: true
        default: "2026101104"
        type: string
      identity:
        description: Release identity file inside this repository
        required: true
        default: inputs/release-2026101104.json
        type: string
      tools_tag:
        description: Release holding the retained signing toolchain
        required: true
        default: signing-tools-2026101104-v1
        type: string
      candidate_tag:
        description: Tag for the signed candidate prerelease
        required: true
        default: signed-2026101104-r6
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: sign-${{ inputs.candidate_tag }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    environment:
      name: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_ROOT: /home/qingli/crux-pe13-offline-2026-09-25/pe13
      HOST_TOOLS: /home/qingli/crux-pe13-release-tier1-2026-10-09/android-out/host/linux-x86
      IDENTITY: ${{ github.workspace }}/${{ inputs.identity }}
      RUN_ID: ${{ inputs.run_id }}
      TASK_ID: ${{ inputs.task_id }}
      ARTIFACT: ${{ inputs.artifact }}
      KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
      KERNEL_TASK_ID: ${{ inputs.kernel_task_id }}
      KERNEL_ARTIFACT: ${{ inputs.kernel_artifact }}
      WORKER_COMMIT: ${{ inputs.worker_commit }}
      TOOLS_TAG: ${{ inputs.tools_tag }}
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Configure runner paths
        shell: bash
        run: |
          set -euo pipefail
          # `runner.temp` is not available to job-level env, so the working root is
          # exported where the shells can read it.
          echo "OUTPUT_ROOT=$RUNNER_TEMP/signing" >> "$GITHUB_ENV"

      - name: Record runner resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT/result"
          {
            uname -a; nproc; free -b; df -B1; python3 -V
          } > "$OUTPUT_ROOT/result/runner.txt"
          cat "$OUTPUT_ROOT/result/runner.txt"

      - name: Free disk space
        continue-on-error: true
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "false"
          remove-swapfile: "false"
          verbose: "false"

      - uses: actions/checkout@v7.0.1

      - name: Configure the retained signing layout
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$OUTPUT_ROOT/result/host-setup.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y zstd python-is-python3 cpio unzip
          sudo mkdir -p /home/qingli
          sudo chown -R "$(id -u):$(id -g)" /home/qingli
          mkdir -p "$OUTPUT_ROOT"

      - name: Restore the retained signing toolchain and public material
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$OUTPUT_ROOT/result/toolchain.log") 2>&1
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path

          output = Path(os.environ['OUTPUT_ROOT'])
          repository = os.environ['GH_REPO']
          tag = os.environ['TOOLS_TAG']
          assets = json.loads(Path(os.environ['IDENTITY']).parent.joinpath('signing-tools.json').read_text())

          def digest(path):
              result = hashlib.sha256()
              with open(path, 'rb') as stream:
                  for block in iter(lambda: stream.read(1 << 22), b''):
                      result.update(block)
              return result.hexdigest()

          staged = output / 'tools'
          staged.mkdir(parents=True, exist_ok=True)
          for name, record in assets['archives'].items():
              subprocess.run(['gh', 'release', 'download', tag, '--repo', repository,
                              '--pattern', name, '--dir', str(staged)], check=True)
              path = staged / name
              if digest(path) != record['sha256']:
                  raise SystemExit('Signing archive digest mismatch: ' + name)
              subprocess.run(['sudo', 'tar', '--zstd', '--no-same-owner', '-xpf', str(path), '-C', '/'],
                             check=True)
              path.unlink()
              print('Restored ' + name, flush=True)
          mirror = assets['clang_mirror']
          subprocess.run(['gh', 'release', 'download', mirror['release_tag'], '--repo', repository,
                          '--pattern', mirror['asset'], '--dir', str(staged)], check=True)
          path = staged / mirror['asset']
          if digest(path) != mirror['sha256']:
              raise SystemExit('Compiler archive digest mismatch')
          target = Path(os.environ['SOURCE_ROOT']) / 'prebuilts/clang/host/linux-x86/clang-r450784d'
          # The source tree arrives from archives extracted as root, so the
          # compiler destination is created and handed to the runner first.
          subprocess.run(['sudo', 'mkdir', '-p', str(target)], check=True)
          subprocess.run(['sudo', 'chown', '-R', '%d:%d' % (os.getuid(), os.getgid()),
                          str(target)], check=True)
          subprocess.run(['sudo', 'tar', '--no-same-owner', '-xpf', str(path), '-C', str(target)], check=True)
          path.unlink()
          print('Restored compiler ' + mirror['asset'], flush=True)
          PY

      - name: Verify both compile runs and download their artifacts
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$OUTPUT_ROOT/result/artifacts.log") 2>&1
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys, zipfile
          from pathlib import Path

          output = Path(os.environ['OUTPUT_ROOT'])
          repository = os.environ['GH_REPO']
          records = {}

          def run_record(record_name, run_id):
              payload = json.loads(subprocess.run(
                  ['gh', 'api', 'repos/%s/actions/runs/%s' % (repository, run_id)],
                  capture_output=True, text=True, check=True).stdout)
              if payload.get('conclusion') != 'success' or payload.get('event') != 'workflow_dispatch':
                  raise SystemExit(record_name + ' run is not a successful dispatch')
              if not str(payload.get('path', '')).endswith('.github/workflows/wave.yml'):
                  raise SystemExit(record_name + ' run is not a cold wave run')
              head = payload['head_sha']
              if os.environ.get('WORKER_COMMIT') and os.environ['WORKER_COMMIT'] != head:
                  raise SystemExit(record_name + ' run head differs from the asserted worker commit')
              print('Run %s %s head %s' % (record_name, run_id, head), flush=True)
              return {'run_id': int(run_id), 'head_sha': head, 'url': payload['html_url'],
                      'conclusion': payload['conclusion'], 'path': payload['path']}

          def artifact(record_name, run_id, name):
              payload = json.loads(subprocess.run(
                  ['gh', 'api', 'repos/%s/actions/runs/%s/artifacts' % (repository, run_id)],
                  capture_output=True, text=True, check=True).stdout)
              matches = [row for row in payload['artifacts'] if row['name'] == name]
              if len(matches) != 1:
                  raise SystemExit('Artifact is absent or ambiguous: ' + name)
              row = matches[0]
              if row['expired']:
                  raise SystemExit('Artifact has expired: ' + name)
              directory = output / record_name
              directory.mkdir(parents=True, exist_ok=True)
              # `gh run download` extracts without exposing the archive, so the
              # artifact is fetched as its raw zip and hashed before extraction.
              archive = directory / (name + '.zip')
              with archive.open('wb') as destination:
                  subprocess.run(['gh', 'api',
                                  'repos/%s/actions/artifacts/%s/zip' % (repository, row['id'])],
                                 stdout=destination, check=True)
              hasher = hashlib.sha256()
              with archive.open('rb') as stream:
                  for block in iter(lambda: stream.read(1 << 22), b''):
                      hasher.update(block)
              actual = 'sha256:' + hasher.hexdigest()
              if actual != row['digest']:
                  raise SystemExit('Artifact digest mismatch: ' + name)
              subprocess.run(['unzip', '-q', str(archive), '-d', str(directory)], check=True)
              archive.unlink()
              run = run_record(record_name, run_id)
              records[record_name] = {'artifact': name, 'digest': actual, 'run_id': int(run_id),
                                      'head_sha': run['head_sha'], 'run_url': run['url']}
              print('Verified artifact %s %s' % (name, actual), flush=True)
              return directory

          terminal = artifact('terminal', os.environ['RUN_ID'], os.environ['ARTIFACT'])
          kernel = artifact('kernel', os.environ['KERNEL_RUN_ID'], os.environ['KERNEL_ARTIFACT'])
          for directory, label in ((terminal, 'terminal'), (kernel, 'kernel')):
              archive = directory / 'outputs.tar.zst'
              if not archive.is_file():
                  raise SystemExit('Worker outputs archive is absent for ' + label)
              subprocess.run(['sudo', 'tar', '--zstd', '--no-same-owner', '-xpf', str(archive), '-C', '/'],
                             check=True)
              archive.unlink()
              print('Extracted worker outputs for ' + label, flush=True)
          (output / 'artifact-records.json').write_text(json.dumps(records, indent=2) + '\n')
          PY

      - name: Bind the signed inputs to the compile run
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$OUTPUT_ROOT/result/input-binding.log") 2>&1
          python3 - "$OUTPUT_ROOT" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          output = Path(sys.argv[1])
          records = json.loads((output / 'artifact-records.json').read_text())
          identity = json.loads(Path(os.environ['IDENTITY']).read_text())
          command = [sys.executable, 'signing/verify-hosted-inputs.py',
                     '--receipt', output / 'terminal/receipt.json',
                     '--run-id', os.environ['RUN_ID'],
                     '--run-url', 'https://github.com/%s/actions/runs/%s' % (os.environ['GH_REPO'],
                                                                            os.environ['RUN_ID']),
                     '--task-id', os.environ['TASK_ID'],
                     '--artifact', os.environ['ARTIFACT'],
                     '--artifact-digest', records['terminal']['digest'],
                     '--kernel-receipt', output / 'kernel/receipt.json',
                     '--kernel-run-id', os.environ['KERNEL_RUN_ID'],
                     '--kernel-run-url', 'https://github.com/%s/actions/runs/%s' % (os.environ['GH_REPO'],
                                                                                   os.environ['KERNEL_RUN_ID']),
                     '--kernel-task-id', os.environ['KERNEL_TASK_ID'],
                     '--kernel-artifact', os.environ['KERNEL_ARTIFACT'],
                     '--kernel-artifact-digest', records['kernel']['digest'],
                     '--worker-commit', records['terminal']['head_sha'],
                     '--kernel-worker-commit', records['kernel']['head_sha'],
                     '--identity', os.environ['IDENTITY'],
                     '--target-files', identity['target_files']['artifact_path'],
                     '--kernel-root', identity['kernel']['base'],
                     '--output', output / 'input-binding.json']
          raise SystemExit(subprocess.run(command).returncode)
          PY

      - name: Rebuild the retained Recovery verifier from source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$OUTPUT_ROOT/result/verifier-build.log") 2>&1
          python3 - "$OUTPUT_ROOT" <<'PY'
          import json, os, shutil, subprocess, sys
          from pathlib import Path
          output = Path(sys.argv[1])
          source = Path(os.environ['SOURCE_ROOT'])
          retained = Path('/home/qingli/crux-pe13-standard-tests-2026-10-07/recovery-out')
          host = Path(os.environ['HOST_TOOLS'])
          build = output / 'verifier-build'
          build.mkdir(parents=True, exist_ok=True)
          clang = source / 'prebuilts/clang/host/linux-x86/clang-r450784d/bin/clang++'
          libs = ['-L', str(retained / 'host/linux-x86/lib64'),
                  '-Wl,-rpath,' + str(retained / 'host/linux-x86/lib64'),
                  '-lbase', '-lcrypto-host', '-lziparchive', '-lcutils', '-llog', '-lselinux', '-lz-host']
          common = ['-std=gnu++17', '-stdlib=libc++', '-nostdinc++', '-D_FILE_OFFSET_BITS=64', '-pthread',
                    '-isystem', 'external/libcxx/include', '-isystem', 'external/libcxxabi/include',
                    '-I', 'bootable/recovery', '-I', 'bootable/recovery/otautil/include',
                    '-I', 'system/libbase/include', '-I', 'system/libziparchive/include',
                    '-I', 'external/boringssl/src/include',
                    str(retained / 'soong/.intermediates/bootable/recovery/otautil/libotautil/'
                                   'linux_glibc_x86_64_static/libotautil.a')]
          commands = [
              ['verifier', common + ['-Wall', '-Werror', str(Path('signing/gates/ota-verifier-host.cpp').resolve())]
               + libs + ['-o', str(build / 'ota-verifier-host')]],
              ['tests', common + ['-I', 'bootable/recovery/tests',
                                  '-I', 'external/googletest/googletest/include',
                                  'bootable/recovery/tests/unit/verifier_test.cpp',
                                  'external/googletest/googletest/src/gtest_main.cc',
                                  str(retained / 'soong/.intermediates/external/googletest/googletest/'
                                                 'libgtest/linux_glibc_x86_64_static/libgtest.a')]
               + libs + ['-o', str(build / 'verifier_host_test')]],
          ]
          for label, command in commands:
              completed = subprocess.run([str(clang), *command], cwd=str(source), capture_output=True, text=True)
              (build / (label + '.log')).write_text(completed.stdout + completed.stderr)
              if completed.returncode != 0:
                  print(completed.stdout[-4000:], completed.stderr[-4000:], flush=True)
                  raise SystemExit('Verifier rebuild failed: ' + label)
              print('Rebuilt ' + label, flush=True)
          PY

      - name: Run the retained Recovery verifier tests
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$OUTPUT_ROOT/result/verifier-tests.log") 2>&1
          python3 signing/hosted_sign.py --stage verifier-tests \
            --output-root "$OUTPUT_ROOT" --identity "$IDENTITY" \
            --source-root "$SOURCE_ROOT" --host-tools "$HOST_TOOLS" \
            --jdk-home "$SOURCE_ROOT/prebuilts/jdk/jdk11/linux-x86" \
            --key-dir "$OUTPUT_ROOT/keys" --config "$GITHUB_WORKSPACE/signing/signing-config.json" \
            --public-materials /home/qingli/crux-pe13-release-tier3-2026-10-11/public-signing \
            --verifier "$OUTPUT_ROOT/verifier-build/ota-verifier-host" \
            --verifier-test "$OUTPUT_ROOT/verifier-build/verifier_host_test" \
            --verifier-lib /home/qingli/crux-pe13-standard-tests-2026-10-07/recovery-out/host/linux-x86/lib64 \
            --test-cwd /home/qingli/crux-pe13-release-tier1-2026-10-09/recovery-verifier-host

      - name: Materialize the release keys from environment secrets
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$OUTPUT_ROOT/result/keys.log") 2>&1
          python3 - "$OUTPUT_ROOT" <<'PY'
          import base64, json, os, subprocess, sys
          from pathlib import Path
          output = Path(sys.argv[1])
          parts = []
          index = 0
          while ('CRUX_RELEASE_KEYS_%02d' % index) in os.environ:
              parts.append(os.environ['CRUX_RELEASE_KEYS_%02d' % index])
              index += 1
          if index == 0:
              raise SystemExit('No release key secrets are visible to this environment')
          blob = base64.b64decode(''.join(parts))
          archive = output / 'keys.tar.zst'
          archive.write_bytes(blob)
          keys = output / 'keys'
          keys.mkdir(mode=0o700, exist_ok=True)
          subprocess.run(['tar', '--zstd', '-xf', str(archive), '-C', str(keys)], check=True)
          archive.unlink()
          root = keys / 'pe13'
          if not root.is_dir():
              raise SystemExit('Release key bundle does not contain the pe13 directory')
          count = sum(1 for path in root.rglob('*') if path.is_file())
          print('Materialized %d release key files from %d secret parts' % (count, index), flush=True)
          if count < 100:
              raise SystemExit('Release key bundle looks incomplete')
          PY
        env:
          CRUX_RELEASE_KEYS_00: ${{ secrets.CRUX_RELEASE_KEYS_00 }}
          CRUX_RELEASE_KEYS_01: ${{ secrets.CRUX_RELEASE_KEYS_01 }}
          CRUX_RELEASE_KEYS_02: ${{ secrets.CRUX_RELEASE_KEYS_02 }}
          CRUX_RELEASE_KEYS_03: ${{ secrets.CRUX_RELEASE_KEYS_03 }}
          CRUX_RELEASE_KEYS_04: ${{ secrets.CRUX_RELEASE_KEYS_04 }}
          CRUX_RELEASE_KEYS_05: ${{ secrets.CRUX_RELEASE_KEYS_05 }}

      - name: Sign the target-files
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$OUTPUT_ROOT/result/signing.log") 2>&1
          export TMPDIR="$OUTPUT_ROOT/tmp"
          mkdir -p "$TMPDIR"
          python3 signing/hosted_sign.py --stage package \
            --output-root "$OUTPUT_ROOT" --identity "$IDENTITY" \
            --source-root "$SOURCE_ROOT" --host-tools "$HOST_TOOLS" \
            --jdk-home "$SOURCE_ROOT/prebuilts/jdk/jdk11/linux-x86" \
            --key-dir "$OUTPUT_ROOT/keys/pe13" --config "$GITHUB_WORKSPACE/signing/signing-config.json" \
            --public-materials /home/qingli/crux-pe13-release-tier3-2026-10-11/public-signing \
            --verifier "$OUTPUT_ROOT/verifier-build/ota-verifier-host" \
            --verifier-test "$OUTPUT_ROOT/verifier-build/verifier_host_test" \
            --verifier-lib /home/qingli/crux-pe13-standard-tests-2026-10-07/recovery-out/host/linux-x86/lib64
          rm -rf "$TMPDIR"

      - name: Run the four native gates
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$OUTPUT_ROOT/result/signing.log") 2>&1
          export TMPDIR="$OUTPUT_ROOT/tmp"
          mkdir -p "$TMPDIR"
          python3 signing/hosted_sign.py --stage acceptance \
            --output-root "$OUTPUT_ROOT" --identity "$IDENTITY" \
            --source-root "$SOURCE_ROOT" --host-tools "$HOST_TOOLS" \
            --jdk-home "$SOURCE_ROOT/prebuilts/jdk/jdk11/linux-x86" \
            --key-dir "$OUTPUT_ROOT/keys/pe13" --config "$GITHUB_WORKSPACE/signing/signing-config.json" \
            --public-materials /home/qingli/crux-pe13-release-tier3-2026-10-11/public-signing \
            --verifier "$OUTPUT_ROOT/verifier-build/ota-verifier-host" \
            --verifier-test "$OUTPUT_ROOT/verifier-build/verifier_host_test" \
            --verifier-lib /home/qingli/crux-pe13-standard-tests-2026-10-07/recovery-out/host/linux-x86/lib64
          rm -rf "$TMPDIR"

      - name: Build the candidate delivery
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$OUTPUT_ROOT/result/signing.log") 2>&1
          export TMPDIR="$OUTPUT_ROOT/tmp"
          mkdir -p "$TMPDIR"
          python3 signing/hosted_sign.py --stage delivery \
            --output-root "$OUTPUT_ROOT" --identity "$IDENTITY" \
            --source-root "$SOURCE_ROOT" --host-tools "$HOST_TOOLS" \
            --jdk-home "$SOURCE_ROOT/prebuilts/jdk/jdk11/linux-x86" \
            --key-dir "$OUTPUT_ROOT/keys/pe13" --config "$GITHUB_WORKSPACE/signing/signing-config.json" \
            --public-materials /home/qingli/crux-pe13-release-tier3-2026-10-11/public-signing \
            --verifier "$OUTPUT_ROOT/verifier-build/ota-verifier-host" \
            --verifier-test "$OUTPUT_ROOT/verifier-build/verifier_host_test" \
            --verifier-lib /home/qingli/crux-pe13-standard-tests-2026-10-07/recovery-out/host/linux-x86/lib64
          rm -rf "$TMPDIR"

      - name: Remove the materialized release keys
        if: always()
        shell: bash
        run: |
          rm -rf "$OUTPUT_ROOT/keys"
          echo "release key material removed from the runner"

      - name: Publish the signed candidate release
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$OUTPUT_ROOT/result/signing.log") 2>&1
          python3 - "$OUTPUT_ROOT" <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          output = Path(sys.argv[1])
          identity = json.loads(Path(os.environ['IDENTITY']).read_text())
          delivery = output / 'delivery'
          manifest = json.loads((delivery / 'candidate-manifest.json').read_text())
          assets = [delivery / row['name'] for row in manifest['assets'].values()]
          def digest(path):
              hasher = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1 << 22), b''):
                      hasher.update(block)
              return hasher.hexdigest()
          for path, row in zip(assets, manifest['assets'].values()):
              if not path.is_file() or path.stat().st_size != row['bytes'] or \
                      digest(path) != row['sha256']:
                  raise SystemExit('Candidate asset changed after delivery: ' + path.name)
          tag = os.environ['CANDIDATE_TAG']
          view = subprocess.run(['gh', 'release', 'view', tag, '--json', 'tagName'],
                                capture_output=True, text=True)
          if view.returncode != 0:
              notes = ('Signed candidate ' + identity['build_number'] + ' built by '
                       'coachpo/crux-pe13-distributed from run %s.\n\n'
                       'Not recommended by the OTA feed. Publication verifies these asset digests '
                       'before the feed can point at them.' % os.environ.get('GITHUB_RUN_ID', ''))
              subprocess.run(['gh', 'release', 'create', tag, '--title',
                              'Crux PE13 signed candidate ' + identity['build_number'],
                              '--prerelease', '--notes', notes], check=True)
          subprocess.run(['gh', 'release', 'upload', tag, *[str(path) for path in assets],
                          str(delivery / 'candidate-manifest.json'), '--clobber'], check=True)
          (output / 'result/candidate-release.json').write_text(json.dumps(
              {'tag': tag, 'assets': manifest['assets']}, indent=2) + '\n')
          print(json.dumps({'tag': tag, 'assets': manifest['assets']}, indent=2), flush=True)
          PY

      - name: Upload the signed target-files for publication
        # The public channel needs the signed pair, and the OTA repository cannot
        # host a 5.5 GB asset; the publication run downloads this artifact from
        # this run instead.
        if: ${{ success() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-target-files-${{ inputs.build_number }}
          path: ${{ runner.temp }}/signing/release-r6-ota/signed-target_files.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload signing evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: signing-evidence-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/signing/result/
            ${{ runner.temp }}/signing/*-contract.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
