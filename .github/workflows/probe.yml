name: Standard runner resource probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Record disk space before cleanup
        run: |
          mkdir -p probe
          df -B1 > probe/disks-before-cleanup.txt
      - name: Free disk space
        continue-on-error: true
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "false"
          remove-swapfile: "false"
          verbose: "false"
      - uses: actions/checkout@v7.0.1
      - name: Record actual standard runner resources
        run: |
          mkdir -p probe
          uname -a | tee probe/uname.txt
          lscpu | tee probe/cpu.txt
          free -b | tee probe/memory.txt
          df -B1 | tee probe/disks.txt
          cat /etc/os-release | tee probe/os-release.txt
          env | sort | sed -n '/^Image/p' | tee probe/image.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: standard-runner-probe
          path: probe/
          retention-days: 7
