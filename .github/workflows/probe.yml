name: Standard runner resource probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Record actual standard runner resources
        run: |
          mkdir -p probe
          uname -a | tee probe/uname.txt
          lscpu | tee probe/cpu.txt
          free -b | tee probe/memory.txt
          df -B1 | tee probe/disks.txt
          cat /etc/os-release | tee probe/os-release.txt
          env | sort | sed -n '/^Image/p' | tee probe/image.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: standard-runner-probe
          path: probe/
          retention-days: 7
