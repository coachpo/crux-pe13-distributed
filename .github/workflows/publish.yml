name: Publish PE13 release and feed
run-name: PE13 publish ${{ inputs.build_number }} as ${{ inputs.ota_tag }}

# Publishes an already signed candidate to the public OTA channel. The order is
# fixed by the channel's own contract:
#
#   1. every candidate asset is downloaded from the signed candidate release and
#      checked against the digest recorded when it was signed,
#   2. `prepare_release.py` reads the signed target-files and the signed OTA and
#      refuses a pair that does not describe the same build,
#   3. a new immutable prerelease tag is created in `coachpo/crux-pe13-ota` and the
#      unchanged signed bytes are uploaded,
#   4. `recommend_release.py` re-reads the release through the API and compares the
#      uploaded asset digest before it moves the feed, then `validate_site.py`
#      checks the whole site,
#   5. the site commit is pushed, the Pages workflow is awaited and the public feed
#      is fetched again and compared with the local one.
#
# This workflow needs the `release` environment, which requires a reviewer, and the
# OTA repository token.

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Signed candidate release in this repository
        required: true
        type: string
      sign_run_id:
        description: Run that holds the signed-target-files artifact
        required: true
        type: string
      ota_tag:
        description: New immutable release tag in coachpo/crux-pe13-ota
        required: true
        type: string
      build_number:
        description: Frozen build number
        required: true
        default: "2026101104"
        type: string
      identity:
        description: Release identity file inside this repository
        required: true
        default: inputs/release-2026101104.json
        type: string
      release_notes:
        description: Release notes file inside this repository
        required: true
        default: publishing/release-notes-2026101104.md
        type: string
      install_guide:
        description: Install guide file inside this repository
        required: true
        default: publishing/INSTALL-2026101104.md
        type: string
      publish:
        description: Actually publish; leave false for a dry run
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ inputs.ota_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    environment:
      name: release
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: coachpo/crux-pe13-ota
      PAGES_URL: https://coachpo.github.io/crux-pe13-ota
      IDENTITY: ${{ github.workspace }}/${{ inputs.identity }}
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      OTA_TAG: ${{ inputs.ota_tag }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      SIGN_RUN_ID: ${{ inputs.sign_run_id }}
      NOTES: ${{ inputs.release_notes }}
      GUIDE: ${{ inputs.install_guide }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure the publication workspace
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_WORK=$RUNNER_TEMP/publish" >> "$GITHUB_ENV"
          echo "OTA_REPO=$RUNNER_TEMP/publish/ota" >> "$GITHUB_ENV"
          export RUNNER_WORK="$RUNNER_TEMP/publish"
          export OTA_REPO="$RUNNER_TEMP/publish/ota"
          mkdir -p "$RUNNER_WORK/result" "$RUNNER_WORK/assets"
          sudo apt-get update
          sudo apt-get install -y zstd
          gh auth setup-git
          GH_TOKEN="$CRUX_OTA_TOKEN" gh auth setup-git
          git clone --depth 1 "https://github.com/$REPOSITORY.git" "$OTA_REPO"
          git -C "$OTA_REPO" rev-parse HEAD > "$RUNNER_WORK/result/ota-revision.txt"
          cat "$RUNNER_WORK/result/ota-revision.txt"
        env:
          CRUX_OTA_TOKEN: ${{ secrets.CRUX_OTA_TOKEN }}

      - name: Download the signed candidate and verify every asset digest
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_WORK/result/candidate.log") 2>&1
          python3 - "$RUNNER_WORK" <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path

          work = Path(sys.argv[1])
          identity = json.loads(Path(os.environ['IDENTITY']).read_text())
          tag = os.environ['CANDIDATE_TAG']
          assets = work / 'assets'
          subprocess.run(['gh', 'release', 'download', tag, '--repo', os.environ['GITHUB_REPOSITORY'],
                          '--pattern', 'candidate-manifest.json', '--dir', str(assets)], check=True)
          manifest = json.loads((assets / 'candidate-manifest.json').read_text())
          for role, record in manifest['assets'].items():
              subprocess.run(['gh', 'release', 'download', tag, '--repo', os.environ['GITHUB_REPOSITORY'],
                              '--pattern', record['name'], '--dir', str(assets)], check=True)
              path = assets / record['name']
              hasher = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1 << 22), b''):
                      hasher.update(block)
              if path.stat().st_size != record['bytes'] or hasher.hexdigest() != record['sha256']:
                  raise SystemExit('Candidate asset differs from its signed record: ' + record['name'])
              print('Verified candidate asset ' + record['name'], flush=True)
          if manifest['fingerprint'] != identity['signed_fingerprint']:
              raise SystemExit('Candidate fingerprint differs from the frozen release identity')
          PY

      - name: Download the signed target-files from the signing run
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_WORK/result/candidate.log") 2>&1
          gh run download "$SIGN_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "signed-target-files-$BUILD_NUMBER" --dir "$RUNNER_WORK/signed" || {
              echo "signed target-files artifact is absent from run $SIGN_RUN_ID" >&2
              exit 1
            }
          find "$RUNNER_WORK/signed" -maxdepth 2 -type f -printf '%s %p\n' | sort -rn | head -5

      - name: Prepare the release record from the signed pair
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_WORK/result/prepare.log") 2>&1
          python3 - "$RUNNER_WORK" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          work = Path(sys.argv[1])
          identity = json.loads(Path(os.environ['IDENTITY']).read_text())
          assets = work / 'assets'
          signed = sorted((work / 'signed').rglob('signed-target_files.zip'))
          if len(signed) != 1:
              raise SystemExit('Signed target-files artifact is absent or ambiguous')
          record_dir = Path(os.environ['OTA_REPO']) / 'site/releases'
          before = {path.name for path in record_dir.glob('*.json')}
          command = [sys.executable, 'scripts/prepare_release.py',
                     '--signed-target-files', str(signed[0]),
                     '--ota', str(assets / identity['delivery']['ota']),
                     '--tag', os.environ['OTA_TAG'],
                     '--filename', identity['delivery']['ota'],
                     '--site-dir', 'site',
                     '--repository', os.environ['REPOSITORY']]
          result = subprocess.run(command, cwd=os.environ['OTA_REPO'])
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          created = sorted({path.name for path in record_dir.glob('*.json')} - before)
          if len(created) != 1:
              raise SystemExit('Release record was not created exactly once')
          (work / 'result/release-record.json').write_text(
              (record_dir / created[0]).read_text())
          PY

      - name: Create the immutable prerelease and upload the signed bytes
        if: ${{ inputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CRUX_OTA_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_WORK/result/upload.log") 2>&1
          python3 - "$RUNNER_WORK" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          work = Path(sys.argv[1])
          identity = json.loads(Path(os.environ['IDENTITY']).read_text())
          assets = work / 'assets'
          notes = Path(os.environ['GITHUB_WORKSPACE']) / os.environ['NOTES']
          guide = Path(os.environ['GITHUB_WORKSPACE']) / os.environ['GUIDE']
          tag = os.environ['OTA_TAG']
          view = subprocess.run(['gh', 'release', 'view', tag, '--repo', os.environ['REPOSITORY'],
                                 '--json', 'tagName'], capture_output=True, text=True)
          if view.returncode != 0:
              subprocess.run(['gh', 'release', 'create', tag, '--repo', os.environ['REPOSITORY'],
                              '--prerelease', '--title',
                              'Crux PE13 ' + identity['build_number'] + ' OTA candidate',
                              '--notes-file', str(notes)], check=True)
          uploads = [assets / identity['delivery']['ota'], assets / identity['delivery']['recovery'],
                     notes, guide]
          subprocess.run(['gh', 'release', 'upload', tag, *[str(path) for path in uploads],
                          '--repo', os.environ['REPOSITORY'], '--clobber'], check=True)
          listing = subprocess.run(['gh', 'release', 'view', tag, '--repo', os.environ['REPOSITORY'],
                                    '--json', 'tagName,assets'], capture_output=True, text=True, check=True)
          (work / 'result/uploaded-release.json').write_text(listing.stdout)
          print(listing.stdout, flush=True)
          PY

      - name: Recommend only after the uploaded asset digest matches
        if: ${{ inputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CRUX_OTA_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_WORK/result/recommend.log") 2>&1
          python3 - "$RUNNER_WORK" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          work = Path(sys.argv[1])
          identity = json.loads(Path(os.environ['IDENTITY']).read_text())
          manifest = json.loads((work / 'assets/candidate-manifest.json').read_text())
          command = [sys.executable, 'scripts/recommend_release.py',
                     '--release-id', manifest['assets']['ota']['sha256'],
                     '--uploaded-release-json', str(work / 'result/uploaded-release.json'),
                     '--site-dir', 'site']
          raise SystemExit(subprocess.run(command, cwd=os.environ['OTA_REPO']).returncode)
          PY

      - name: Validate the site and record the release identity
        if: ${{ inputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CRUX_OTA_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_WORK/result/recommend.log") 2>&1
          python3 - "$RUNNER_WORK" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          work = Path(sys.argv[1])
          subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-v'],
                         cwd=os.environ['OTA_REPO'], check=True)
          subprocess.run([sys.executable, '-B', 'scripts/validate_site.py', '--site-dir', 'site'],
                         cwd=os.environ['OTA_REPO'], check=True)
          manifest = json.loads((work / 'assets/candidate-manifest.json').read_text())
          feed = json.loads((Path(os.environ['OTA_REPO']) / 'site/updates/crux/thirteen_plus.json').read_text())
          if feed['id'] != manifest['assets']['ota']['sha256']:
              raise SystemExit('Local feed does not name the prepared release')
          (work / 'result/feed.json').write_text(json.dumps(feed, indent=2) + '\n')
          PY

      - name: Push the site commit and wait for Pages
        if: ${{ inputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CRUX_OTA_TOKEN }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_WORK/result/pages.log") 2>&1
          cd "$OTA_REPO"
          # Stage everything first: a new release record is an untracked file, and
          # `git diff` alone would not see it.
          git add -A
          if git diff --cached --quiet; then
            # Republishing an already recommended release leaves the site unchanged;
            # the public feed is still fetched and compared below.
            echo "the site already names this release; no commit is required"
            echo "unchanged" > "$RUNNER_WORK/result/site-revision.txt"
          else
            git -c user.name="crux-pipeline" -c user.email="coachpo@users.noreply.github.com" \
              commit -q -m "Recommend ${BUILD_NUMBER} as ${OTA_TAG}"
            git push origin HEAD:main
            git rev-parse HEAD > "$RUNNER_WORK/result/site-revision.txt"
            cat "$RUNNER_WORK/result/site-revision.txt"
          fi
          python3 - "$RUNNER_WORK" "$(cat "$RUNNER_WORK/result/site-revision.txt")" <<'PY'
          import json, os, subprocess, sys, time
          from pathlib import Path
          work, revision = Path(sys.argv[1]), sys.argv[2]
          pages_completed = False
          deadline = time.time() + 900 if revision != 'unchanged' else 0
          while time.time() < deadline:
              listing = subprocess.run(['gh', 'run', 'list', '--repo', os.environ['REPOSITORY'],
                                        '--workflow', 'pages.yml', '--limit', '5', '--json',
                                        'databaseId,headSha,status,conclusion'],
                                       capture_output=True, text=True, check=True)
              runs = [row for row in json.loads(listing.stdout) if row['headSha'] == revision]
              if runs and runs[0]['status'] == 'completed':
                  if runs[0]['conclusion'] != 'success':
                      raise SystemExit('Pages deployment failed: %s' % runs[0]['databaseId'])
                  pages_completed = True
                  break
              time.sleep(20)
          if revision != 'unchanged' and not pages_completed:
              raise SystemExit('Pages deployment did not complete for ' + revision)
          import urllib.request
          url = 'https://coachpo.github.io/crux-pe13-ota/updates/crux/thirteen_plus.json'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      published = json.loads(response.read().decode())
                  break
              except Exception as error:
                  print('waiting for the public feed: %s' % error, flush=True)
                  time.sleep(20)
          else:
              raise SystemExit('Public feed did not become readable')
          local = json.loads((work / 'result/feed.json').read_text())
          if published != local:
              raise SystemExit('Public feed differs from the prepared site')
          (work / 'result/public-feed.json').write_text(json.dumps(published, indent=2) + '\n')
          print('public feed verified for ' + published['id'], flush=True)
          PY

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: publish-evidence-${{ inputs.build_number }}
          path: ${{ runner.temp }}/publish/result/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
