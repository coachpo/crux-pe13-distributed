name: Assemble and verify a fresh PE13 build without publication
run-name: Verify fresh PE13 compilation ${{ inputs.build_run }}
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful fresh standard compilation execution
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: fresh-assembly-${{ inputs.build_run }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Bind compilation to this pipeline revision
        env:
          BUILD_RUN: ${{ inputs.build_run }}
        run: python3 scripts/pipeline_code.py --run "$BUILD_RUN"
      - name: Install image validation tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          sudo apt-get update
          sudo apt-get install -y zstd u-boot-tools device-tree-compiler e2fsprogs \
            android-sdk-libsparse-utils cpio python-is-python3 gcc-aarch64-linux-gnu
          sudo mkdir -p /home/qingli
          sudo chown "$(id -u):$(id -g)" /home/qingli
          { uname -a; nproc; free -b; df -B1; } > "$RUNNER_TEMP/result/runner.txt"
      - name: Restore the new compilation context
        run: |
          set -euo pipefail
          python3 scripts/cloud_artifacts.py --run "${{ inputs.build_run }}" --repository "$GITHUB_REPOSITORY" \
            --name cloud-build-context --destination "$RUNNER_TEMP/context"
          python3 scripts/cloud_artifacts.py --run "${{ inputs.build_run }}" --repository "$GITHUB_REPOSITORY" \
            --name cloud-fresh-build-summary --destination "$RUNNER_TEMP/compile-summary"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import cloud_reuse
          root = Path(os.environ['RUNNER_TEMP'])
          context = json.loads((root / 'context/context.json').read_text())
          summary = json.loads((root / 'compile-summary/build-summary.json').read_text())
          cloud_reuse.validate_summary(context, summary)
          if (summary.get('status') != 'success' or not context.get('tasks')
                  or summary.get('task_count') != len(context['tasks'])
                  or summary.get('execution_id') != '${{ inputs.build_run }}'
                  or summary.get('worker_commit') != context.get('worker_commit')):
              raise SystemExit('Every admitted fresh compilation task must succeed before assembly')
          PY
      - name: Admit new producers, assemble and verify images
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 scripts/cloud_assemble.py --context "$RUNNER_TEMP/context/context.json" \
            --output "$RUNNER_TEMP/result" --staging "$RUNNER_TEMP/assembly" \
            2>&1 | tee "$RUNNER_TEMP/result/assembly.log"
      - name: Verify final delivery and decompressed system image identity
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/result/delivery"
          log="$RUNNER_TEMP/result/delivery-integrity.log"
          sha256sum -c --strict SHA256SUMS 2>&1 | tee "$log"
          python3 - <<'PY' 2>&1 | tee -a "$log"
          import hashlib, json, subprocess
          from pathlib import Path

          record = json.loads(Path("delivery-record.json").read_text())
          expected = record["system_image"]["uncompressed"]
          digest = hashlib.sha256()
          size = 0
          with subprocess.Popen(["zstd", "-dc", "--", "system.img.zst"], stdout=subprocess.PIPE) as decoder:
              for chunk in iter(lambda: decoder.stdout.read(4 * 1024 * 1024), b""):
                  size += len(chunk)
                  digest.update(chunk)
              if decoder.wait() != 0:
                  raise SystemExit("system.img.zst: decompression failed")
          actual = {"size": size, "sha256": digest.hexdigest()}
          if actual != expected:
              raise SystemExit(f"system.img.zst: expected uncompressed identity {expected}, got {actual}")
          print("system.img.zst: verified uncompressed identity " + json.dumps(actual, sort_keys=True))
          PY
      - name: Build the installer and the unsigned ZIP payload
        run: |
          set -euo pipefail
          make -C installer test
          make -C installer CROSS=aarch64-linux-gnu-
          delivery="$RUNNER_TEMP/result/delivery"
          work="$RUNNER_TEMP/zip-work"
          mkdir -p "$work"
          zstd -dc -- "$delivery/system.img.zst" > "$work/system.img"
          simg2img "$work/system.img" "$work/system.raw.img"
          rm -f -- "$work/system.img"
          simg2img "$delivery/vendor.img" "$work/vendor.raw.img"
          build=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["build_number"])' \
            "$delivery/delivery-record.json")
          profile=$(python3 -c 'import json; print(json.load(open("config/install-twrp.json"))["profile_id"])')
          python3 scripts/crux_zip.py prepare --system "$work/system.raw.img" --vendor "$work/vendor.raw.img" \
            --recovery-fit "$delivery/recovery-cepheus.itb" --rom-fit "$delivery/rom-cepheus.itb" \
            --installer installer/build/crux-installer --build-number "$build" --any-serial \
            --twrp-profile "$profile" --out "$RUNNER_TEMP/result/zip-payload" \
            2>&1 | tee "$RUNNER_TEMP/result/zip-payload.log"
          rm -f -- "$work"/*.raw.img
      - name: Retain the ZIP manifest for the release signature
        uses: ./.github/actions/retain-artifact
        with:
          name: zip-manifest
          path: ${{ runner.temp }}/result/zip-payload/crux-install.txt
          retention-days: 3
          if-no-files-found: error
      - name: Retain unpublished ROM images and validation evidence
        if: always()
        uses: ./.github/actions/retain-artifact
        with:
          name: cloud-fresh-rom-${{ inputs.build_run }}
          path: ${{ runner.temp }}/result/
          retention-days: 3
          compression-level: 0

  next:
    needs: assemble
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Sign and release this assembly
        id: dispatch
        continue-on-error: true
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f assembly_run="$GITHUB_RUN_ID" -f operation=release
      - name: Report the failed dispatch
        if: steps.dispatch.outcome == 'failure'
        run: python3 scripts/pipeline_report.py --stage assemble --detail 'The release could not be dispatched.'

  report:
    needs: [assemble, next]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Retry eligible validation failure without cache reuse
        if: ${{ needs.assemble.result == 'failure' && !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retry/context" "$RUNNER_TEMP/retry/assembly"
          if ! python3 scripts/cloud_artifacts.py --run "$BUILD_RUN" --repository "$GITHUB_REPOSITORY" \
              --name cloud-build-context --destination "$RUNNER_TEMP/retry/context"; then
            echo 'No admitted context is available for a safe cold retry.'
            exit 0
          fi
          if ! python3 scripts/cloud_artifacts.py --run "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" \
              --name "cloud-fresh-rom-$BUILD_RUN" --destination "$RUNNER_TEMP/retry/assembly"; then
            echo 'No typed assembly failure evidence is available for a safe cold retry.'
            exit 0
          fi
          python3 scripts/pipeline_retry.py --stage assemble \
            --context "$RUNNER_TEMP/retry/context/context.json" \
            --failure-evidence "$RUNNER_TEMP/retry/assembly/validation-failure.json" \
            --origin-run "$BUILD_RUN"
      - name: Report the failed assembly
        run: python3 scripts/pipeline_report.py --stage assemble
