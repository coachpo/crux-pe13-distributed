name: Deliver a verified PE13 build to dev OTA
run-name: Dev OTA ${{ inputs.operation }} ${{ inputs.tag }} from assembly ${{ inputs.assembly_run }}

on:
  workflow_dispatch:
    inputs:
      assembly_run:
        description: Successful assemble-standard.yml run ID (not the compile run)
        required: true
        type: string
      tag:
        description: "Development version: dev-pe13-<build>-v<n>"
        required: true
        type: string
      operation:
        description: Preflight (read only), prepare a draft, or publish a complete draft
        required: true
        default: preflight
        type: choice
        options: [preflight, draft, publish]
      ota_start_builds:
        description: "Phone release (optional): installed builds allowed to update, comma-separated"
        required: false
        default: ""
        type: string
      ota_serial:
        description: "Phone release: serial the FITs carry, or any"
        required: false
        default: ""
        type: string
      ota_signature:
        description: "Phone release: offline P-256 signature of the phone manifest (128 hex digits)"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: standard-dev-ota-release
  cancel-in-progress: false

env:
  ASSEMBLY_RUN: ${{ inputs.assembly_run }}
  RELEASE_TAG: ${{ inputs.tag }}
  OPERATION: ${{ inputs.operation }}
  OTA_START_BUILDS: ${{ inputs.ota_start_builds }}
  OTA_SERIAL: ${{ inputs.ota_serial }}
  OTA_SIGNATURE: ${{ inputs.ota_signature }}
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    if: github.repository == 'coachpo/crux-pe13-distributed' && github.ref == 'refs/heads/main' && inputs.operation == 'preflight'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the assembly delivery without release writes
        run: |
          python3 scripts/dev_release.py --assembly-run "$ASSEMBLY_RUN" --tag "$RELEASE_TAG" \
            --ota-start-builds "$OTA_START_BUILDS" --ota-serial "$OTA_SERIAL" --ota-signature "$OTA_SIGNATURE"

  release:
    if: github.repository == 'coachpo/crux-pe13-distributed' && github.ref == 'refs/heads/main' && (inputs.operation == 'draft' || inputs.operation == 'publish')
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare or publish the verified development delivery
        run: |
          python3 scripts/dev_release.py --assembly-run "$ASSEMBLY_RUN" --tag "$RELEASE_TAG" \
            --operation "$OPERATION" --ota-start-builds "$OTA_START_BUILDS" --ota-serial "$OTA_SERIAL" \
            --ota-signature "$OTA_SIGNATURE"
