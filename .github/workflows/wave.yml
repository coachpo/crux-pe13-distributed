name: Cold distributed PE13 wave
run-name: PE13 ${{ inputs.tag }} wave ${{ inputs.wave }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release containing the cold input capsules
        required: true
        type: string
      wave:
        description: Wave identifier (downloads wave-<wave>.json)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Download and validate wave
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          WAVE: ${{ inputs.wave }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          for name in ('RELEASE_TAG', 'WAVE'):
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', os.environ[name]):
                  raise SystemExit('Invalid ' + name)
          PY
          gh release download "$RELEASE_TAG" --pattern "wave-$WAVE.json" --dir wave
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          wave = json.loads(Path('wave', 'wave-' + os.environ['WAVE'] + '.json').read_text())
          matrix = wave.get('matrix', wave)
          include = matrix['include']
          if not include or len(include) > 256:
              raise SystemExit('A wave must contain 1 to 256 tasks')
          ids = set()
          for task in include:
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', task['id']) or task['id'] in ids:
                  raise SystemExit('Invalid or duplicate task ID')
              ids.add(task['id'])
              if not isinstance(task['capsule_assets'], list) or not task['capsule_assets']:
                  raise SystemExit('Task has no capsule')
              for asset in task['capsule_assets']:
                  if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', asset):
                      raise SystemExit('Invalid capsule asset name')
              if not isinstance(task.get('shared_capsules', []), list):
                  raise SystemExit('shared_capsules must be an array')
              for layer in task.get('shared_capsules', []):
                  if not isinstance(layer, dict):
                      raise SystemExit('Invalid shared layer descriptor')
                  if not isinstance(layer.get('assets'), list) or not layer['assets']:
                      raise SystemExit('Shared layer has no asset parts')
                  for asset in layer['assets']:
                      if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', asset):
                          raise SystemExit('Invalid shared layer asset name')
                  if 'layer_id' in layer and not re.fullmatch(r'[a-f0-9]{64}', layer['layer_id']):
                      raise SystemExit('Invalid shared layer identity')
              if not isinstance(task.get('source_overlays', []), list):
                  raise SystemExit('source_overlays must be an array')
              for overlay in task.get('source_overlays', []):
                  if not isinstance(overlay, dict) or not isinstance(overlay.get('assets'), list) or not overlay['assets']:
                      raise SystemExit('Source overlay has no asset parts')
                  for asset in overlay['assets']:
                      if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', asset):
                          raise SystemExit('Invalid source overlay asset name')
              if 'source_archives' in task:
                  profile = task['source_archives']
                  if not isinstance(profile, dict) or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*\.json', profile.get('profile_asset', '')):
                      raise SystemExit('Invalid frozen source archive profile asset')
                  if not isinstance(profile.get('bundle_assets', []), list):
                      raise SystemExit('Frozen source bundle assets must be an array')
                  for asset in profile.get('bundle_assets', []):
                      if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*\.json', asset):
                          raise SystemExit('Invalid frozen source bundle asset')
              for dependency in task.get('dependencies', []):
                  if not str(dependency['run_id']).isdigit():
                      raise SystemExit('Invalid dependency run ID')
                  if not re.fullmatch(r'shard-[A-Za-z0-9][A-Za-z0-9_.-]*', dependency['artifact']):
                      raise SystemExit('Invalid dependency artifact name')
                  if dependency.get('id') != dependency['artifact'][6:]:
                      raise SystemExit('Dependency id and artifact differ')
                  if not re.fullmatch(r'[a-f0-9]{40}', dependency.get('expected_worker_commit', '')):
                      raise SystemExit('Dependency has no expected compilation worker commit')
                  if not re.fullmatch(r'[a-f0-9]{64}', dependency.get('expected_manifest_sha256', '')):
                      raise SystemExit('Dependency has no expected Ninja manifest identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': include}, separators=(',', ':')) + '\n')
          PY

  compile:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      TASK_JSON: ${{ toJson(matrix) }}
      SOURCE_ROOT: /home/qingli/crux-pe13-offline-2026-09-25/pe13
    steps:
      - name: Record disk space before cleanup
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          df -B1 > "$RUNNER_TEMP/result/disks-before-cleanup.txt"
      - name: Free disk space
        continue-on-error: true
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "false"
          remove-cached-tools: "false"
          remove-swapfile: "false"
          verbose: "false"
      - uses: actions/checkout@v7.0.1
      - name: Record actual runner resources
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          uname -a > "$RUNNER_TEMP/result/runner.txt"
          lscpu >> "$RUNNER_TEMP/result/runner.txt"
          free -b >> "$RUNNER_TEMP/result/runner.txt"
          df -B1 >> "$RUNNER_TEMP/result/runner.txt"
      - name: Install native host dependencies
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/result/host-dependencies.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y libncurses5 python-is-python3 flex bison libssl-dev libelf-dev zstd \
            ccache build-essential libxml2-utils zip unzip cpio lz4 xz-utils bc rsync
      - name: Download cold capsule and exact producer artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capsules" "$RUNNER_TEMP/dependencies" "$RUNNER_TEMP/result"
          exec > >(tee "$RUNNER_TEMP/result/transport.log") 2>&1
          python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          task = json.loads(os.environ['TASK_JSON'])
          staging = Path(os.environ['RUNNER_TEMP'])
          def restore(assets, label):
              directory = staging / 'capsules' / label
              directory.mkdir(parents=True, exist_ok=True)
              process = subprocess.Popen(['sudo', 'tar', '--zstd', '--no-same-owner',
                                          '-xpf', '-', '-C', '/'], stdin=subprocess.PIPE)
              try:
                  for asset in assets:
                      subprocess.run(['gh', 'release', 'download', os.environ['RELEASE_TAG'],
                                      '--pattern', asset, '--dir', str(directory)], check=True)
                      part = directory / asset
                      with part.open('rb') as source:
                          shutil.copyfileobj(source, process.stdin, 1024 * 1024)
                      process.stdin.flush()
                      part.unlink()
                  process.stdin.close()
                  if process.wait() != 0:
                      raise RuntimeError('Capsule extraction failed: ' + label)
              finally:
                  try:
                      if not process.stdin.closed:
                          process.stdin.close()
                  finally:
                      process.wait()
              directory.rmdir()
              print('Restored capsule ' + label, flush=True)
          for index, layer in enumerate(task.get('shared_capsules', [])):
              restore(layer['assets'], 'shared-' + str(index))
              if 'layer_id' in layer:
                  print('Shared source layer: ' + layer['layer_id'], flush=True)
          restore(task['capsule_assets'], 'task')
          for index, overlay in enumerate(task.get('source_overlays', [])):
              restore(overlay['assets'], 'overlay-' + str(index))
          if 'source_archives' in task:
              profile_asset = task['source_archives']['profile_asset']
              profile_dir = staging / 'source-archive-profile'
              subprocess.run(['gh', 'release', 'download', os.environ['RELEASE_TAG'],
                              '--pattern', profile_asset, '--dir', str(profile_dir)], check=True)
              profile = profile_dir / profile_asset
              shutil.copy2(profile, staging / 'result/remote-source-profile.json')
              source_command = ['sudo', 'python3', 'scripts/source_archives.py',
                                '--profile', str(profile), '--bundle',
                                str(Path(os.environ['SOURCE_ROOT']) / '.crux-task/graph/bundle.json')]
              bundles = staging / 'result/frozen-source-bundles'
              for asset in task['source_archives'].get('bundle_assets', []):
                  subprocess.run(['gh', 'release', 'download', os.environ['RELEASE_TAG'],
                                  '--pattern', asset, '--dir', str(bundles)], check=True)
                  source_command += ['--bundle', str(bundles / asset)]
              source_command += ['--receipt', str(staging / 'result/remote-source-receipt.json')]
              subprocess.run(source_command, check=True)
          for index, dependency in enumerate(task.get('dependencies', [])):
              subprocess.run(['gh', 'run', 'download', str(dependency['run_id']),
                              '--name', dependency['artifact'], '--dir', str(staging / 'dependencies' / str(index))], check=True)
          PY
          sudo chown -R "$(id -u):$(id -g)" /home/qingli
          rmdir "$RUNNER_TEMP/capsules"
      - name: Compile selected native Ninja actions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          task = json.loads(os.environ['TASK_JSON'])
          staging = Path(os.environ['RUNNER_TEMP'])
          source = Path(os.environ['SOURCE_ROOT'])
          bindings = staging / 'result/dependency-bindings.json'
          bindings.write_text(json.dumps(task.get('dependencies', []), indent=2) + '\n')
          command = ['python3', 'scripts/worker.py', '--id', task['id'],
                     '--manifest', str(source / '.crux-task/graph/manifest.json'),
                     '--bundle', str(source / '.crux-task/graph/bundle.json'),
                     '--output-dir', str(staging / 'result'), '--jobs', '4',
                     '--dependency-bindings', str(bindings)]
          if 'dependency_supersessions' in task:
              supersessions = staging / 'result/dependency-supersessions.json'
              supersessions.write_text(json.dumps(task['dependency_supersessions'], indent=2) + '\n')
              command += ['--dependency-supersessions', str(supersessions)]
          for index, dependency in enumerate(task.get('dependencies', [])):
              command += ['--dependency-dir', str(staging / 'dependencies' / str(index))]
          raise SystemExit(subprocess.run(command).returncode)
          PY
      - name: Upload task output and receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shard-${{ matrix.id }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
