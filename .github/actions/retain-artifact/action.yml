name: Retain artifact with one retry
description: Upload an artifact, retrying one failed upload after a short delay.
inputs:
  name:
    description: Artifact name owned by this upload.
    default: artifact
  path:
    description: Files, directories or wildcard patterns to upload.
    required: true
  retention-days:
    description: Retention period; empty uses the repository default.
  compression-level:
    description: Zlib compression level from 0 to 9.
    default: '6'
  if-no-files-found:
    description: Behavior when no files match (warn, error or ignore).
    default: warn
  overwrite:
    description: Replace an existing same-name artifact on the first attempt.
    default: 'false'
outputs:
  artifact-id:
    description: ID returned by the successful upload.
    value: ${{ steps.first.outcome == 'success' && steps.first.outputs.artifact-id || steps.retry.outcome == 'success' && steps.retry.outputs.artifact-id || '' }}
  artifact-url:
    description: URL returned by the successful upload.
    value: ${{ steps.first.outcome == 'success' && steps.first.outputs.artifact-url || steps.retry.outcome == 'success' && steps.retry.outputs.artifact-url || '' }}
  artifact-digest:
    description: Digest returned by the successful upload.
    value: ${{ steps.first.outcome == 'success' && steps.first.outputs.artifact-digest || steps.retry.outcome == 'success' && steps.retry.outputs.artifact-digest || '' }}
runs:
  using: composite
  steps:
    - name: Upload artifact
      id: first
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: ${{ inputs.overwrite }}
    - name: Wait before retry
      if: ${{ always() && steps.first.outcome == 'failure' }}
      shell: bash
      run: sleep 10
    - name: Retry artifact upload
      id: retry
      if: ${{ always() && steps.first.outcome == 'failure' }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        # Failed finalization can leave this upload's same-name artifact behind.
        overwrite: 'true'
